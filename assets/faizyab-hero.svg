<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Faizyab Ahmad — Full-Stack Developer, UI/UX Designer, AI and SQA Enthusiast</title>
  <desc id="heroDesc">Dark burgundy editorial-style banner with orbital linework, a fine grid and restrained animated glows. All text stays visible without animation.</desc>
  <defs>
    <linearGradient id="faHeroBackground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/><stop offset="0.5" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="faHeroHalo" cx="68%" cy="42%" r="67%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".48"/>
      <stop offset=".46" stop-color="#451126" stop-opacity=".22"/>
      <stop offset="1" stop-color="#10070C" stop-opacity="0"/>
      <animate attributeName="cx" values="68%;63%;68%" dur="14s" repeatCount="indefinite"/>
    </radialGradient>
    <linearGradient id="faHeroName" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8F0F3"/><stop offset=".58" stop-color="#F1DDE5"/><stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
    <linearGradient id="faHeroLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0"/>
      <stop offset=".36" stop-color="#E5B5C7" stop-opacity=".92"/>
      <stop offset=".73" stop-color="#C77B9B" stop-opacity=".75"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="faHeroSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E5B5C7" stop-opacity="0"/>
      <stop offset=".5" stop-color="#E5B5C7" stop-opacity=".9"/>
      <stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="faHeroGrid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#E5B5C7" stroke-width=".6" stroke-opacity=".13"/>
    </pattern>
    <radialGradient id="faHeroGridFade"><stop offset=".05" stop-color="white" stop-opacity=".95"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>
    <mask id="faHeroGridMask"><rect width="1200" height="430" fill="url(#faHeroGridFade)"/></mask>
    <filter id="faHeroGlow" x="-75%" y="-75%" width="250%" height="250%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="faHeroSoftGlow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <clipPath id="faHeroClip"><rect width="1200" height="430" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#faHeroClip)">
    <rect width="1200" height="430" fill="url(#faHeroBackground)"/>
    <rect width="1200" height="430" fill="url(#faHeroHalo)"/>
    <rect width="1200" height="430" fill="url(#faHeroGrid)" mask="url(#faHeroGridMask)"/>
    <path d="M0 29H1200 M0 401H1200" fill="none" stroke="#E5B5C7" stroke-opacity=".16"/>
    <path d="M48 0V430 M1152 0V430" fill="none" stroke="#E5B5C7" stroke-opacity=".1"/>
    <g fill="none" stroke="#C77B9B" stroke-opacity=".35" stroke-width="1">
      <path d="M47 65H82 M47 65V95 M1153 65H1119 M1153 65V95 M47 365H82 M47 365V335 M1153 365H1119 M1153 365V335"/>
    </g>
    <circle cx="978" cy="220" r="148" fill="none" stroke="#C77B9B" stroke-opacity=".13" stroke-width="1"/>
    <circle cx="978" cy="220" r="119" fill="none" stroke="#C77B9B" stroke-opacity=".37" stroke-width="1" stroke-dasharray="3 9"/>
    <circle cx="978" cy="220" r="87" fill="none" stroke="#E5B5C7" stroke-opacity=".27" stroke-width="1"/>
    <circle cx="978" cy="220" r="57" fill="none" stroke="#E5B5C7" stroke-opacity=".23" stroke-width="1"/>
    <g transform="translate(978 220)">
      <g>
        <ellipse rx="151" ry="57" fill="none" stroke="#C77B9B" stroke-width="1.15" stroke-opacity=".43" transform="rotate(-28)"/>
        <ellipse rx="151" ry="57" fill="none" stroke="#E5B5C7" stroke-width=".75" stroke-opacity=".24" transform="rotate(42)"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite" additive="sum"/>
      </g>
      <g>
        <path d="M-118 -92A150 150 0 0 1 112 -101" fill="none" stroke="url(#faHeroLine)" stroke-width="3" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
      </g>
    </g>
    <circle cx="978" cy="220" r="35" fill="#701A3D" fill-opacity=".14"/>
    <path d="M963 220L975 232L997 207" fill="none" stroke="#E5B5C7" stroke-opacity=".75" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1066" cy="132" r="5" fill="#E5B5C7" filter="url(#faHeroGlow)" opacity=".85"/>
    <circle cx="1066" cy="132" r="3" fill="#F8F0F3"/>
    <g fill="#E5B5C7">
      <circle cx="866" cy="298" r="2" opacity=".62"><animate attributeName="opacity" values=".25;.85;.25" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="1118" cy="248" r="2.2" opacity=".65"><animate attributeName="opacity" values=".65;.14;.65" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="825" cy="138" r="1.9" opacity=".8"/>
      <circle cx="1030" cy="358" r="1.5" opacity=".65"/>
      <circle cx="1135" cy="95" r="1.7" opacity=".8"/>
    </g>
    <path d="M801 347L853 347 M1103 94H1135" stroke="#E5B5C7" stroke-opacity=".38" stroke-width="1"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="91" y="71" fill="#C77B9B" font-size="12" font-weight="700" letter-spacing="4">FA / PORTFOLIO</text>
      <text x="1112" y="71" fill="#C77B9B" font-size="10" text-anchor="end" letter-spacing="2">DESIGN × ENGINEERING</text>
      <path d="M91 96H704" fill="none" stroke="#E5B5C7" stroke-opacity=".2"/>
      <circle cx="91" cy="123" r="3" fill="#C77B9B"/>
      <text x="105" y="127" fill="#E5B5C7" font-size="12" letter-spacing="3">BUILDING THE INTERFACE BETWEEN IDEAS AND IMPACT</text>
      <text x="87" y="210" fill="url(#faHeroName)" font-size="81" font-weight="700" letter-spacing="5">FAIZYAB</text>
      <text x="88" y="293" fill="url(#faHeroName)" font-size="81" font-weight="700" letter-spacing="6">AHMAD</text>
      <rect x="91" y="309" width="491" height="2" rx="1" fill="#701A3D"/>
      <rect x="91" y="308" width="491" height="3" rx="1.5" fill="url(#faHeroLine)" opacity=".9"/>
      <rect x="91" y="306" width="124" height="7" rx="3.5" fill="url(#faHeroSweep)" filter="url(#faHeroSoftGlow)" opacity=".75">
        <animate attributeName="x" values="91;458;91" dur="9s" repeatCount="indefinite"/>
      </rect>
      <text x="92" y="349" fill="#F8F0F3" font-size="18" font-weight="500" letter-spacing=".35">Full-Stack Developer  <tspan fill="#C77B9B">/</tspan>  UI/UX Designer</text>
      <text x="92" y="376" fill="#E5B5C7" font-size="15" letter-spacing=".5">AI &amp; SQA Enthusiast</text>
      <text x="91" y="412" fill="#C77B9B" opacity=".85" font-size="11" letter-spacing="1.3">TURNING IDEAS INTO MEANINGFUL DIGITAL EXPERIENCES</text>
      <text x="1109" y="412" fill="#C77B9B" opacity=".8" font-size="11" text-anchor="end" letter-spacing="1.2">CREATIVE SYSTEMS / 001</text>
    </g>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="428.5" rx="21.25" fill="none" stroke="#C77B9B" stroke-opacity=".32" stroke-width="1.5"/>
</svg>