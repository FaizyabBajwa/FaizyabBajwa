<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-labelledby="footerTitle footerDesc">
 <title id="footerTitle">Designed and built by Faizyab Ahmad</title>
 <desc id="footerDesc">Minimal burgundy footer with subtle animated flowing lines and a static text signature.</desc>
 <defs>
