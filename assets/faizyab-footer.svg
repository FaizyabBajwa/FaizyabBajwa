  <radialGradient id="faFooterGlow"><stop offset="0" stop-color="#701A3D" stop-opacity=".28"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/></radialGradient>
  <clipPath id="faFooterClip"><rect width="1200" height="150" rx="18"/></clipPath>
 </defs>
